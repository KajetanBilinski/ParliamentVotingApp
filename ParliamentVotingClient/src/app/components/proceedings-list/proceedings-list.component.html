<div class="proceedings-container">
  <h1>Lista Posiedzeń Sejmu</h1>

  <div class="search-row">
    <label class="search-label">Filtruj po zakresie dat:</label>
    <p-datepicker
      [inputStyle]="{ width: '250px' }"
      selectionMode="range"
      [(ngModel)]="dateRange"
      [showClear]="true"
    ></p-datepicker>
  </div>

  <div class="proceedings-list">
    @for (proceeding of filteredProceedings(); track proceeding.proceedingNumber) {
    <p-card class="proceeding-card" (dblclick)="openProceeding(proceeding.proceedingNumber)">
      <ng-template pTemplate="header">
        <div class="card-header">
          <div class="header-left">Posiedzenie</div>
          <div class="header-right">nr {{ proceeding.proceedingNumber }}</div>
        </div>
      </ng-template>

      <div class="card-body">
        <div class="dates-block">
          <ul class="dates-list">
            @for (d of proceeding.formattedDates; track d) {
            <p-chip class="date-chip">{{ formatDate(d) }}</p-chip>
            }
          </ul>
        </div>
      </div>

      <ng-template pTemplate="footer">
        <div class="card-footer">
          <button class="open-btn" (click)="openProceeding(proceeding.proceedingNumber)">
            Otwórz
          </button>
        </div>
      </ng-template>
    </p-card>
    }
  </div>

  @if (loading()) {
  <div class="loading">
    <p-progressSpinner ariaLabel="Ładowanie"></p-progressSpinner>
    <p>Ładowanie...</p>
  </div>
  } @if (error()) {
  <p-message severity="error" [text]="error()"></p-message>
  }
</div>
